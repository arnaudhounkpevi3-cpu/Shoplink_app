<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Boutique ShopLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #176b5b;
      --secondary: #0f493f;
      --accent: #f59c1a;
      --bg: #fbf7ef;
      --soft: #eef7f1;
      --card: #ffffff;
      --text: #111827;
      --muted: #667085;
      --border: rgba(17, 24, 39, 0.10);
      --shadow: 0 18px 48px rgba(17, 24, 39, 0.08);
      --radius: 22px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -4%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 30%),
        radial-gradient(circle at 90% 8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
        linear-gradient(180deg, var(--bg), #fff 72%);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font-family: inherit; }

    .owner-inline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .owner-inline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--primary) 18%, transparent);
      background: rgba(255,255,255,.78);
      color: var(--primary);
      box-shadow: 0 10px 26px rgba(17,24,39,.07);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .owner-inline-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
      filter: brightness(0) invert(1);
    }

    .owner-inline-btn:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .owner-inline-btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .shop-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(1180px, calc(100% - 28px));
      margin: 14px auto 0;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 18px 54px rgba(17,24,39,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--primary);
      font-weight: 900;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--primary) 16%, transparent);
      box-shadow: 0 12px 28px color-mix(in srgb, var(--primary) 14%, transparent), inset 0 0 0 1px rgba(255,255,255,.72);
      flex: 0 0 auto;
    }

    .brand-logo img { width: 100%; height: 100%; object-fit: contain; padding: 7px; background: #fff; display:block; }
    .brand-name { font-weight: 900; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brand-mini { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.45);
      border: 1px solid rgba(255,255,255,.52);
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      padding: 8px 11px;
      border-radius: 999px;
      transition: background .18s ease, color .18s ease;
      white-space: nowrap;
    }

    .nav-menu a:hover {
      background: color-mix(in srgb, var(--primary) 10%, white);
      color: var(--primary);
    }

    .nav-menu a.active {
      background: var(--primary);
      color: #fff;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    .pill-btn {
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: var(--primary);
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 12px 26px color-mix(in srgb, var(--primary) 24%, transparent);
    }

    .hero {
      width: min(1180px, calc(100% - 28px));
      margin: 34px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: clamp(28px, 5vw, 70px);
      align-items: center;
      padding: clamp(32px, 6vw, 74px);
      border-radius: 36px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 14%, white), rgba(255,255,255,.88)),
        radial-gradient(circle at 88% 18%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 32%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.7);
      overflow: hidden;
      position: relative;
      max-width: calc(100vw - 28px);
    }

    .hero > div {
      min-width: 0;
      max-width: 100%;
    }

    .hero::after {
      content: '';
      position: absolute;
      right: -80px;
      bottom: -120px;
      width: 300px;
      height: 300px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      pointer-events: none;
    }

    .activity-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid color-mix(in srgb, var(--primary) 16%, transparent);
      color: var(--secondary);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 18px;
    }

    .hero h1 {
      width: 100%;
      max-width: 12ch;
      font-size: clamp(32px, 4.8vw, 64px);
      line-height: 1;
      letter-spacing: -.052em;
      overflow-wrap: break-word;
      word-break: break-word;
      hyphens: auto;
      text-wrap: balance;
      white-space: normal;
    }

    .hero-subtitle {
      max-width: 58ch;
      margin: 20px 0 24px;
      color: var(--muted);
      font-size: clamp(15px, 1.4vw, 18px);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn.secondary {
      background: rgba(255,255,255,.74);
      color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 16%, transparent);
      box-shadow: none;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .meta-card {
      background: rgba(255,255,255,.72);
      border: 1px solid color-mix(in srgb, var(--primary) 12%, transparent);
      border-radius: 18px;
      padding: 13px;
      min-width: 0;
    }

    @media (min-width: 821px) {
      .hero-meta {
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        justify-content: start;
        align-items: stretch;
      }

      .meta-card {
        display: block;
        width: 100%;
        max-width: 100%;
        padding: 13px 14px;
        white-space: normal;
      }

      .meta-label {
        display: inline-flex;
        align-items: center;
        margin: 0 0 6px;
      }

      .meta-value {
        margin-top: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
    }

    .meta-card-link {
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .meta-card-link:hover,
    .meta-card-link:focus-visible {
      transform: translateY(-1px);
      background: #fff;
      border-color: color-mix(in srgb, var(--primary) 26%, transparent);
      outline: none;
    }

    .info-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 6px;
    }

    .meta-label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .meta-value { margin-top: 5px; font-weight: 900; overflow-wrap: anywhere; }

    .hero-visual {
      position: relative;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .featured-card {
      width: min(340px, 100%);
      min-width: 0;
      border-radius: 30px;
      background: #fff;
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 26px 70px rgba(17,24,39,.16);
      overflow: hidden;
      transform: rotate(0deg);
      position: relative;
    }

    .featured-card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.78);
      pointer-events: none;
      z-index: 2;
    }

    .featured-img {
      height: 260px;
      display: grid;
      place-items: center;
      font-size: 72px;
      color: var(--primary);
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.92), rgba(255,255,255,.62) 30%, transparent 31%),
        linear-gradient(135deg, var(--soft), color-mix(in srgb, var(--accent) 18%, #fff));
      overflow: hidden;
    }

    .featured-img img { width: 100%; height: 100%; object-fit: cover; }
    .featured-activity-icon {
      width: clamp(138px, 13vw, 174px) !important;
      height: clamp(138px, 13vw, 174px) !important;
      object-fit: contain;
      display: block;
      margin: auto;
      filter: drop-shadow(0 20px 28px color-mix(in srgb, var(--primary) 28%, transparent));
    }
    .featured-welcome {
      width: min(260px, 86%);
      margin: 0 auto;
      color: var(--primary);
      text-align: center;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.055em;
      font-size: clamp(28px, 4vw, 46px);
      overflow-wrap: anywhere;
    }
    .featured-welcome span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: 0;
      font-weight: 800;
      text-transform: uppercase;
    }
    .featured-body { padding: 18px; }
    .featured-title { font-weight: 900; font-size: 20px; }
    .featured-price { margin-top: 8px; font-weight: 900; color: var(--accent); font-size: 22px; }

    .trust-strip {
      width: min(1180px, calc(100% - 28px));
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .trust-card {
      background: rgba(255,255,255,.78);
      border: 1px solid color-mix(in srgb, var(--primary) 12%, transparent);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 10px 28px rgba(17,24,39,.045);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trust-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--primary);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .trust-title { font-weight: 900; font-size: 13px; }
    .trust-text { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .category-rail {
      width: min(1180px, calc(100% - 28px));
      margin: 28px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-rail::-webkit-scrollbar { display: none; }

    .category-chip {
      flex: 0 0 auto;
      border: 1px solid color-mix(in srgb, var(--primary) 15%, transparent);
      background: rgba(255,255,255,.76);
      color: var(--primary);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 900;
    }

    .section {
      width: min(1180px, calc(100% - 28px));
      margin: 42px auto 0;
    }

    .section-head { text-align: center; margin-bottom: 22px; }
    .section-kicker { color: var(--primary); font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .section-title { margin-top: 7px; font-size: clamp(28px, 3vw, 44px); letter-spacing: -.045em; }
    .section-subtitle { max-width: 620px; margin: 10px auto 0; color: var(--muted); line-height: 1.6; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 18px;
    }

    .empty-products {
      max-width: 620px;
      margin: 0 auto;
      padding: 32px 22px;
      border: 1px dashed color-mix(in srgb, var(--primary) 22%, transparent);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      text-align: center;
      color: var(--muted);
      box-shadow: 0 14px 34px rgba(17,24,39,.05);
    }

    .empty-products strong {
      display: block;
      margin-bottom: 6px;
      color: var(--primary);
      font-size: 18px;
    }

    .product-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(17,24,39,.07);
      transition: transform .22s ease, box-shadow .22s ease;
      cursor: pointer;
      position: relative;
    }

    .product-card::after {
      content: '';
      position: absolute;
      inset: auto 16px 0;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: .72;
    }

    .product-card:hover { transform: translateY(-5px); box-shadow: 0 24px 54px rgba(17,24,39,.13); }

    .product-image {
      height: 230px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--soft), color-mix(in srgb, var(--accent) 10%, #fff));
      color: var(--primary);
      font-size: 52px;
      position: relative;
      overflow: hidden;
    }

    .product-image img { width: 100%; height: 100%; object-fit: cover; }
    .promo-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .product-body { padding: 16px; }
    .product-category { color: var(--primary); font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .product-name { margin-top: 7px; font-size: 18px; font-weight: 900; line-height: 1.2; }
    .product-description { color: var(--muted); margin-top: 10px; line-height: 1.45; font-size: 13px; min-height: 38px; }
    .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .product-price { color: var(--accent); font-size: 20px; font-weight: 900; white-space: nowrap; }

    .product-old-price {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-decoration: line-through;
      opacity: .78;
    }

    .product-extra-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .product-extra-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 5px 8px;
      background: color-mix(in srgb, var(--primary) 8%, white);
      border: 1px solid color-mix(in srgb, var(--primary) 12%, transparent);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 850;
    }

    .product-actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 14px; }
    .btn-details, .btn-add, .btn-order {
      border: 0;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease, opacity .22s ease;
    }

    .btn-details { background: color-mix(in srgb, var(--primary) 10%, #fff); color: var(--primary); }
    .btn-add { background: var(--primary); color: #fff; box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 20%, transparent); }
    .btn-order { background: var(--primary); color: #fff; }
    .btn-details:hover, .btn-add:hover, .btn-order:hover { transform: translateY(-1px); }
    .btn-details:active, .btn-add:active, .btn-order:active { transform: scale(.98); }

    .cart-fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 70;
      min-height: 50px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 20px 50px color-mix(in srgb, var(--primary) 34%, transparent);
      display: none;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .cart-fab.show { display: inline-flex; }

    .cart-count {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      background: #fff;
      color: var(--primary);
      font-size: 12px;
    }

    .cart-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: block;
      background: rgba(17,24,39,.48);
      backdrop-filter: blur(7px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }

    .cart-overlay.show { opacity: 1; pointer-events: auto; }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      width: min(420px, 100%);
      height: 100vh;
      height: 100dvh;
      background: #fff;
      box-shadow: -28px 0 80px rgba(17,24,39,.22);
      transform: translateX(105%);
      transition: transform .38s cubic-bezier(.22, 1, .36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .cart-drawer.show { transform: translateX(0); }

    .cart-head {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: #fff;
    }

    .cart-title { font-size: 22px; font-weight: 900; letter-spacing: -.04em; }
    .cart-subtitle { margin-top: 3px; color: var(--muted); font-size: 13px; }

    .cart-close {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .cart-body {
      flex: 1 0 auto;
      overflow: visible;
      padding: 12px 20px;
    }

    .cart-empty {
      height: 100%;
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-thumb {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--soft);
      display: grid;
      place-items: center;
      color: var(--primary);
      font-size: 25px;
      overflow: hidden;
    }

    .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-name { font-weight: 900; line-height: 1.2; }
    .cart-item-price { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .cart-item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .qty-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in srgb, var(--primary) 8%, #fff);
      border: 1px solid color-mix(in srgb, var(--primary) 14%, transparent);
      border-radius: 999px;
      padding: 4px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: var(--primary);
      font-weight: 900;
      cursor: pointer;
    }

    .qty-value { min-width: 18px; text-align: center; font-weight: 900; }
    .cart-remove { border: 0; background: transparent; color: #b42318; font-weight: 900; cursor: pointer; }

    .cart-footer {
      padding: 18px 20px 20px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg,#fff, color-mix(in srgb, var(--soft) 50%, #fff));
      flex: 0 0 auto;
    }

    .checkout-form {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--border);
    }

    .checkout-form-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .checkout-field {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .checkout-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 12%, transparent);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 900;
    }

    .cart-actions {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
    }

    .about {
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      gap: 24px;
      align-items: stretch;
      margin-top: 48px;
    }

    .about-card {
      border-radius: 28px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .about-card.highlight { background: var(--primary); color: #fff; }
    .about-card.highlight p { color: rgba(255,255,255,.78); }
    .about-card h2 { font-size: clamp(26px, 3vw, 42px); letter-spacing: -.045em; }
    .about-card p { margin-top: 12px; color: var(--muted); line-height: 1.7; }
    .about-card.highlight .about-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .info-list { margin-top: 18px; display: grid; gap: 10px; }
    .info-row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,.18); }
    .info-label { color: rgba(255,255,255,.62); font-size: 12px; font-weight: 900; text-transform: uppercase; }
    .info-value { font-weight: 900; text-align: right; overflow-wrap: anywhere; }

    .footer {
      margin-top: 56px;
      padding: 32px 18px;
      background: #111827;
      color: rgba(255,255,255,.74);
      text-align: center;
    }

    .footer strong { color: #fff; }
    .footer a { color: #fff; text-decoration: none; font-weight: 800; }

    .site-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, .58);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }

    .site-modal.show { opacity: 1; pointer-events: auto; }
    .site-modal-card { width: min(540px, 100%); max-height: 90vh; overflow: auto; border-radius: 28px; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.28); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .34s cubic-bezier(.22, 1, .36, 1), opacity .28s ease; }
    .site-modal.show .site-modal-card { transform: translateY(0) scale(1); opacity: 1; }
    .site-modal-image { min-height: 245px; max-height: 72vh; display: grid; place-items: center; background: var(--soft); color: var(--primary); font-size: 64px; overflow: hidden; }
    .site-modal-image img { width: 100%; height: auto; max-height: 72vh; object-fit: contain; display: block; }
    .site-modal-body { padding: 20px; }
    .site-modal-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .site-modal-title { font-size: 24px; line-height: 1.1; font-weight: 900; letter-spacing: -.04em; }
    .site-modal-close { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 20px; }
    .site-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

    .site-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 120;
      width: min(380px, calc(100% - 28px));
      transform: translate(-50%, 18px) scale(.98);
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.96);
      border: 1px solid color-mix(in srgb, var(--primary) 16%, transparent);
      box-shadow: 0 18px 54px rgba(17,24,39,.18);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      transition: opacity .22s ease, transform .22s ease;
    }

    .site-toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .site-toast-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--primary) 13%, transparent);
      flex: 0 0 auto;
      margin-top: 5px;
    }

    .site-toast-title {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.2;
    }

    .site-toast-message {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.38;
      overflow-wrap: anywhere;
    }

    .site-toast.warning {
      border-color: rgba(245,156,26,.26);
    }

    .site-toast.warning .site-toast-dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .site-toast.error {
      border-color: rgba(180,35,24,.22);
    }

    .site-toast.error .site-toast-dot {
      background: #b42318;
      box-shadow: 0 0 0 5px rgba(180,35,24,.12);
    }

    .loading, .error { max-width: 620px; margin: 60px auto; padding: 18px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); text-align: center; color: var(--muted); }
    .error { color: #b42318; background: #fff4f2; }

    body[data-activity="fastfood"] .btn-order { text-transform: uppercase; letter-spacing: .03em; }
    body[data-activity="fastfood"] .hero { border-radius: 24px; }
    body[data-activity="food"] .hero { border-radius: 28px 48px 28px 48px; }
    body[data-activity="fashion"] .product-card { border-radius: 8px 30px 8px 30px; }
    body[data-activity="fashion"] .product-image { height: 300px; }
    body[data-activity="fashion"] .hero { border-radius: 8px 42px 8px 42px; }
    body[data-activity="beauty"] .product-card { border-radius: 30px; }
    body[data-activity="beauty"] .product-image { height: 220px; border-radius: 0 0 30px 30px; }
    body[data-activity="beauty"] .hero { border-radius: 44px; }

    @media (max-width: 820px) {
      .shop-header { width: calc(100% - 20px); margin-top: 10px; }
      .brand-logo { width: 46px; height: 46px; border-radius: 14px; }
      .brand-logo img { padding: 6px; }
      .nav-menu { display: none; }
      .header-actions { display: none; }
      .hero { grid-template-columns: 1fr; padding: 28px 18px; border-radius: 24px; }
      .hero h1 { font-size: clamp(28px, 9vw, 38px); max-width: 100%; letter-spacing: -.04em; }
      .hero-actions .pill-btn { width: 100%; }
      .hero-meta { grid-template-columns: 1fr; }
      .hero-visual { min-height: auto; }
      .featured-card { transform: none; }
      .trust-strip { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: 1fr; }
      .about { grid-template-columns: 1fr; }
      .product-actions, .site-modal-actions { grid-template-columns: 1fr; }
      .cart-fab { left: 14px; right: 14px; justify-content: center; }
      .cart-drawer { width: 100%; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      .cart-head { padding: 16px; }
      .cart-body { padding: 10px 16px; }
      .cart-footer { padding: 14px 16px max(18px, env(safe-area-inset-bottom)); }
      .cart-actions { grid-template-columns: 1fr; }
      .owner-inline-actions { display: grid; grid-template-columns: 1fr; }
      .owner-inline-btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/css/responsive.css"/>
</head>
<body>
  <div id="app"><div class="loading">Chargement de la boutique...</div></div>
  <button class="cart-fab" id="cart-fab" onclick="openCartDrawer()">Panier <span class="cart-count" id="cart-count">0</span></button>
  <div class="cart-overlay" id="cart-overlay" onclick="closeCartDrawer()"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Panier">
    <div class="cart-head">
      <div>
        <div class="cart-title">Votre panier</div>
        <div class="cart-subtitle">Ajustez les quantités puis commandez via WhatsApp.</div>
      </div>
      <button class="cart-close" onclick="closeCartDrawer()" aria-label="Fermer le panier">×</button>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-footer">
      <div class="checkout-form">
        <div class="checkout-form-title">Informations client</div>
        <input class="checkout-field" id="checkout-name" placeholder="Nom complet" autocomplete="name">
        <input class="checkout-field" id="checkout-whatsapp" placeholder="WhatsApp ex : +22947000674" autocomplete="tel">
        <input class="checkout-field" id="checkout-address" placeholder="Adresse de livraison" autocomplete="street-address">
        <textarea class="checkout-field" id="checkout-note" rows="2" placeholder="Note (optionnel)"></textarea>
      </div>
      <div class="cart-total"><span>Total</span><span id="cart-total">0 FCFA</span></div>
      <div class="cart-actions">
        <button class="btn-details" onclick="clearCart()">Vider</button>
        <button class="btn-order" onclick="orderCart()">Commander le panier</button>
      </div>
    </div>
  </aside>
  <div class="site-modal" id="site-modal" onclick="closeSiteModal(event)"><div class="site-modal-card" id="site-modal-card" onclick="event.stopPropagation()"></div></div>
  <div class="site-toast" id="site-toast" role="status" aria-live="polite">
    <span class="site-toast-dot"></span>
    <div>
      <div class="site-toast-title" id="site-toast-title">Notification</div>
      <div class="site-toast-message" id="site-toast-message"></div>
    </div>
  </div>

  <script src="/js/api-config.js"></script>
  <script>
    const API_BASE = window.SHOPLINK_API_BASE
    const OWNER_MODE = new URLSearchParams(window.location.search).get('owner') === '1'
    let currentSite = null
    let currentProducts = []
    let cart = []
    const startTime = Date.now()

    const THEMES = {
      food: { label: 'Restaurant', title: 'Nos menus', subtitle: 'Choisissez vos plats et commandez directement via WhatsApp.', primary: '#9a3f13', secondary: '#6f2c0d', accent: '#f59c1a', bg: '#fff7eb', soft: '#fff2df', text: '#24140a', icon: '🍽️', iconUrl: 'https://cdn-icons-png.flaticon.com/512/562/562678.png' },
      fastfood: { label: 'Fast-food', title: 'À commander maintenant', subtitle: 'Des produits rapides à choisir et à commander directement via WhatsApp.', primary: '#d9480f', secondary: '#9a3412', accent: '#facc15', bg: '#fff8db', soft: '#fff3bf', text: '#271307', icon: '🍟', iconUrl: 'https://cdn-icons-png.flaticon.com/512/738/738079.png' },
      fashion: { label: 'Boutique mode', title: 'Collection disponible', subtitle: 'Parcourez les articles, découvrez les prix et commandez vos pièces préférées.', primary: '#6d3f8f', secondary: '#43265f', accent: '#d7a247', bg: '#f8f3ff', soft: '#efe6ff', text: '#1f152e', icon: '👗', iconUrl: 'https://cdn-icons-png.flaticon.com/512/7845/7845586.png' },
      beauty: { label: 'Beauté & soins', title: 'Sélection beauté', subtitle: 'Des soins, parfums et produits beauté dans une vitrine douce et élégante.', primary: '#8b3a62', secondary: '#5d2440', accent: '#eaa6c8', bg: '#fff2fa', soft: '#ffe8f4', text: '#28131e', icon: '💄', iconUrl: 'https://cdn-icons-png.flaticon.com/512/8023/8023928.png' },
      commerce: { label: 'Commerce', title: 'Catalogue produits', subtitle: 'Découvrez les articles disponibles et contactez la boutique pour commander.', primary: '#176b5b', secondary: '#0f493f', accent: '#f59c1a', bg: '#f2fbf5', soft: '#e8f7ef', text: '#0f1f17', icon: '🛒', iconUrl: 'https://cdn-icons-png.flaticon.com/512/3144/3144456.png' },
      general: { label: 'Bienvenue', title: 'Nos produits', subtitle: 'Consultez les produits disponibles et commandez facilement via WhatsApp.', primary: '#4c2f88', secondary: '#2f1d55', accent: '#f59c1a', bg: '#f7f2ff', soft: '#eee7ff', text: '#17112a', icon: '', iconUrl: '', welcome: true },
    }

    function activityKey(value) {
      const a = String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      if (/fast\s*-?\s*food|fastfood|burger|snack|sandwich|pizza|frites|tacos|shawarma/.test(a)) return 'fastfood'
      if (/restaurant|repas|plat|menu|boisson|grillade|poulet|riz|food/.test(a)) return 'food'
      if (/boutique|mode|robe|pagne|sac|chaussure|vetement|vêtement/.test(a)) return 'fashion'
      if (/cosm|beaut|maquillage|parfum|creme|crème|cheveux|soin/.test(a)) return 'beauty'
      if (/commerce|commercant|commerçant|vente|shop|marche|marché/.test(a)) return 'commerce'
      return 'general'
    }

    function applyTheme(site) {
      const key = activityKey(site.activityType || site.activity || site.category)
      const theme = THEMES[key] || THEMES.general
      const legacyDefaults = new Set(['#d9643a', '#1a6b4a', '#1a5c38', '#667eea', '#176b5b', '#764ba2'])
      const storedPrimary = String(site.primaryColor || '').toLowerCase()
      const storedSecondary = String(site.secondaryColor || '').toLowerCase()
      const primary = storedPrimary && !legacyDefaults.has(storedPrimary) ? site.primaryColor : theme.primary
      const secondary = storedSecondary && !legacyDefaults.has(storedSecondary) ? site.secondaryColor : theme.secondary
      document.documentElement.style.setProperty('--primary', primary)
      document.documentElement.style.setProperty('--secondary', secondary)
      document.documentElement.style.setProperty('--accent', theme.accent)
      document.documentElement.style.setProperty('--bg', theme.bg)
      document.documentElement.style.setProperty('--soft', theme.soft)
      document.documentElement.style.setProperty('--text', theme.text)
      document.body.dataset.activity = key
      window.shopTheme = { ...theme, primary, secondary, key }
      updateCheckoutPlaceholders(key)
    }

    function updateCheckoutPlaceholders(activityKey) {
      const note = document.getElementById('checkout-note')
      const whatsapp = document.getElementById('checkout-whatsapp')
      if (whatsapp) whatsapp.placeholder = 'WhatsApp ex : +22947000674'
      if (!note) return

      const placeholders = {
        food: 'Note (optionnel) ex : Pas trop de piment, livraison rapide',
        fastfood: 'Note (optionnel) ex : Sans oignon, pas trop de piment',
        fashion: 'Note (optionnel) ex : Taille M, couleur noire',
        beauty: 'Note (optionnel) ex : Peau sensible, parfum léger',
        commerce: 'Note (optionnel) ex : Appeler avant livraison',
        general: 'Note (optionnel) ex : Urgent',
      }

      note.placeholder = placeholders[activityKey] || placeholders.general
    }

    function slugFromUrl() {
      const params = new URLSearchParams(window.location.search)
      return params.get('slug') || window.location.pathname.split('/').filter(Boolean).pop() || 'boutique-test'
    }
    function siteCacheKey(slug) { return `shoplink_public_site_cache:${slug}` }
    function money(value) { return Number(value || 0).toLocaleString('fr-FR') + ' FCFA' }
    function safe(value) { return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') }
    function cleanUrl(slug) { return `${window.location.origin}/boutique/${slug}` }
    function visitSource() {
      const params = new URLSearchParams(window.location.search)
      return params.get('utm_source') || params.get('source') || 'direct'
    }

    async function loadSite(options = {}) {
      const { silent = false } = options
      const slug = slugFromUrl()

      if (!silent) {
        const cached = localStorage.getItem(siteCacheKey(slug))
        if (cached) {
          try {
            const cachedData = JSON.parse(cached)
            if (cachedData.site) {
              currentSite = cachedData.site
              currentProducts = cachedData.products || []
              window.currentSiteId = currentSite.id
              applyTheme(currentSite)
              renderSite(currentSite, currentProducts)
            }
          } catch (_error) {
            localStorage.removeItem(siteCacheKey(slug))
          }
        }
      }

      try {
        const response = await fetch(`${API_BASE}/public/${slug}?t=${Date.now()}`, { cache: 'no-store' })
        const data = await response.json()
        if (!response.ok) throw new Error(data.message || 'Site non trouvé')
        currentSite = data.site
        currentProducts = data.products || []
        window.currentSiteId = currentSite.id
        applyTheme(currentSite)
        localStorage.setItem(siteCacheKey(slug), JSON.stringify({
          site: currentSite,
          products: currentProducts,
          cachedAt: Date.now(),
        }))
        trackOfficialSiteVisit(currentSite.id, visitSource())
        trackWeeklyLinkVisit(currentSite.id, visitSource())
        trackVisit(currentSite.id)
        renderSite(currentSite, currentProducts)
      } catch (error) {
        if (!silent) {
          document.getElementById('app').innerHTML = `<div class="error"><strong>Erreur :</strong> ${safe(error.message)}</div>`
        }
      }
    }

    function displayProducts(products) {
      return (products || []).filter((product) => product && product.name)
    }

    function renderSite(site, products) {
      const theme = window.shopTheme || THEMES.general
      const slug = site.slug || slugFromUrl()
      const sectionIds = siteSectionIds(slug)
      const app = document.getElementById('app')

      app.innerHTML = `
        <header class="shop-header">
          <div class="brand">
            <div class="brand-logo">${site.logo ? `<img src="${site.logo}" alt="Logo ${safe(site.name || 'boutique')}">` : (theme.icon || 'S')}</div>
            <div><div class="brand-name">${safe(site.name)}</div></div>
          </div>
          <nav class="nav-menu" aria-label="Navigation ${safe(site.name)}">
            <a href="#${sectionIds.top}" onclick="scrollToSiteSection(event,'${sectionIds.top}')">Accueil</a>
            <a href="#${sectionIds.products}" onclick="scrollToSiteSection(event,'${sectionIds.products}')">Produits</a>
            ${site.description ? `<a href="#${sectionIds.about}" onclick="scrollToSiteSection(event,'${sectionIds.about}')">À propos</a>` : ''}
          </nav>
        </header>

        <section class="hero" id="${sectionIds.top}">
          <div>
            ${OWNER_MODE ? ownerActions(slug) : ''}
            <h1>${safe(site.name || 'Ma boutique')}</h1>
            ${site.slogan || site.description ? `<p class="hero-subtitle">${safe(site.slogan || site.description)}</p>` : ''}
            ${renderHeroMeta(site, slug)}
          </div>
          <div class="hero-visual">
            <div class="featured-card"><div class="featured-img">${theme.welcome ? `<div class="featured-welcome">Bienvenue sur notre site<span>${safe(site.name || 'ShopLink')}</span></div>` : `<img class="featured-activity-icon" src="${theme.iconUrl}" alt="">`}</div></div>
          </div>
        </section>

        <section class="section" id="${sectionIds.products}">
          <div class="section-head"><div class="section-kicker">${safe(theme.label)}</div><h2 class="section-title">${safe(productSectionTitle(theme, products))}</h2><p class="section-subtitle">${safe(theme.subtitle)}</p></div>
          ${displayProducts(products).length
            ? `<div class="products-grid">${displayProducts(products).map(productCard).join('')}</div>`
            : `<div class="empty-products"><strong>Aucun produit publié</strong>Les produits ajoutés depuis le dashboard apparaîtront ici dès leur publication.</div>`
          }
        </section>

        ${renderAbout(site)}

        <footer class="footer"><p><strong>${safe(site.name)}</strong></p><p>Propulsé par ShopLink · Digitalise ta boutique</p></footer>
      `
    }

    function siteSectionIds(slug) {
      const safeSlug = String(slug || 'boutique').replace(/[^a-z0-9_-]+/gi, '-')
      return {
        top: `site-${safeSlug}-top`,
        products: `site-${safeSlug}-products`,
        about: `site-${safeSlug}-about`,
      }
    }

    function scrollToSiteSection(event, id) {
      event.preventDefault()
      const target = document.getElementById(id)
      if (!target) return
      target.scrollIntoView({ behavior: 'smooth', block: 'start' })
      history.replaceState(null, '', `#${id}`)
    }

    function ownerActions() {
      return `<div class="owner-inline-actions"><a class="owner-inline-btn primary" href="/dashboard-client-shoplink.html"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828765.png" alt="">Retour à ton dashboard</a></div>`
    }

    function renderHeroMeta(site, slug) {
      const cards = []
      if (site.address) {
        cards.push(`<div class="meta-card"><span class="meta-label"><img class="info-icon" src="https://cdn-icons-png.flaticon.com/512/6320/6320900.png" alt="">Adresse</span><div class="meta-value">${safe(site.address)}</div></div>`)
      }
      if (site.whatsapp || site.secondaryPhone) {
        cards.push(`<div class="meta-card"><span class="meta-label"><img class="info-icon" src="https://cdn-icons-png.flaticon.com/512/3059/3059408.png" alt="">Contact</span><div class="meta-value">${safe(site.whatsapp || site.secondaryPhone)}</div></div>`)
      }
      if (OWNER_MODE) {
        cards.push(`<div class="meta-card meta-card-link" role="button" tabindex="0" onclick="copyClientLink('${slug}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();copyClientLink('${slug}')}"><span class="meta-label">Lien client</span><div class="meta-value">/boutique/${safe(slug)}</div></div>`)
      }

      return cards.length ? `<div class="hero-meta">${cards.join('')}</div>` : ''
    }

    function renderAbout(site) {
      return site.description
        ? `<section class="section about" id="${siteSectionIds(site.slug || slugFromUrl()).about}"><div class="about-card highlight"><h2>À propos de la boutique</h2><p>${safe(site.description)}</p></div></section>`
        : ''
    }

    function infoRow(label, value, icon = '') { return `<div class="info-row"><span class="info-label">${icon ? `<img class="info-icon" src="${icon}" alt="">` : ''}${safe(label)}</span><span class="info-value">${safe(value || '—')}</span></div>` }

    function productSectionTitle(theme, products = []) {
      const visibleProducts = displayProducts(products)
      if (theme.key !== 'food') return theme.title

      if (visibleProducts.length === 1) {
        const product = visibleProducts[0]
        const label = `${product.name || ''} ${product.category || ''}`
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()

        if (/plat|repas|assiette|portion/.test(label)) return 'Notre plat'
      }

      return 'Nos menus'
    }

    function productCard(product) {
      const theme = window.shopTheme || THEMES.general
      const badgeText = product.badge ? productBadgeLabel(product.badge) : 'Disponible'
      return `<article class="product-card" onclick="openProductModal('${product.id}')"><div class="product-image">${product.image ? `<img src="${product.image}" alt="${safe(product.name)}">` : theme.icon}<span class="promo-badge">${safe(badgeText)}</span></div><div class="product-body">${product.category ? `<div class="product-category">${safe(product.category)}</div>` : ''}<h3 class="product-name">${safe(product.name)}</h3>${product.description ? `<p class="product-description">${safe(product.description)}</p>` : ''}<div class="product-bottom"><div><div class="product-price">${money(product.price)}</div>${product.oldPrice ? `<div class="product-old-price">${money(product.oldPrice)}</div>` : ''}</div></div>${productMetaTags(product)}<div class="product-actions"><button class="btn-details" onclick="event.stopPropagation();openProductModal('${product.id}')">Voir</button><button class="btn-add" onclick="event.stopPropagation();addToCart('${product.id}')">Ajouter au panier</button></div></div></article>`
    }

    function productBadgeLabel(value) {
      return ({ new: 'Nouveau', popular: 'Populaire', promo: 'Promo', recommended: 'Recommandé' }[value] || value || 'Disponible')
    }

    function productMetaTags(product) {
      const tags = []
      if (product.availability === 'out_of_stock') tags.push('Disponibilité : Rupture')
      if (product.availability === 'available') tags.push('Disponibilité : Disponible')
      if (product.stock !== undefined && product.stock !== '') tags.push(`Stock : ${product.stock}`)
      if (product.variantInfo) tags.push(`Format : ${product.variantInfo}`)
      if (product.extraInfo) tags.push(`Collection : ${product.extraInfo}`)
      return tags.length ? `<div class="product-extra-tags">${tags.map(tag => `<span class="product-extra-tag">${safe(tag)}</span>`).join('')}</div>` : ''
    }

    function getProduct(id) { return currentProducts.find(p => String(p.id) === String(id)) }
    let toastTimer = null
    function toast(message, type = 'success', title = 'ShopLink') {
      const el = document.getElementById('site-toast')
      if (!el) return

      document.getElementById('site-toast-title').textContent = title
      document.getElementById('site-toast-message').textContent = message
      el.classList.remove('warning', 'error')
      if (type === 'warning' || type === 'error') el.classList.add(type)
      el.classList.add('show')

      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600)
    }
    function closeSiteModal(event) { if (!event || event.target === document.getElementById('site-modal')) document.getElementById('site-modal').classList.remove('show') }
    function modal(html) { document.getElementById('site-modal-card').innerHTML = html; document.getElementById('site-modal').classList.add('show') }

    function openProductModal(id) { const product = getProduct(id); if (!product) return; if (!OWNER_MODE) trackProductView(currentSite.id, product.id); const theme = window.shopTheme || THEMES.general; modal(`<div class="site-modal-image">${product.image ? `<img src="${product.image}" alt="${safe(product.name)}">` : theme.icon}</div><div class="site-modal-body"><div class="site-modal-top"><div>${product.category ? `<div class="product-category">${safe(product.category)}</div>` : ''}<div class="site-modal-title">${safe(product.name)}</div></div><button class="site-modal-close" onclick="closeSiteModal()">×</button></div><div class="product-price">${money(product.price)}</div>${product.oldPrice ? `<div class="product-old-price">${money(product.oldPrice)}</div>` : ''}${productMetaTags(product)}${product.description ? `<p class="product-description">${safe(product.description)}</p>` : ''}<div class="site-modal-actions"><button class="btn-details" onclick="closeSiteModal()">Fermer</button><button class="btn-add" onclick="addToCart('${product.id}');closeSiteModal();">Ajouter au panier</button></div></div>`) }
    function addToCart(id) {
      if (OWNER_MODE) {
        toast('Partagez le lien client public pour effectuer une commande.', 'warning', 'Mode aperçu')
        return
      }

      const product = getProduct(id)
      if (!product) return
      const existing = cart.find(item => String(item.id) === String(id))
      if (existing) existing.quantity += 1
      else cart.push({ ...product, quantity: 1 })
      trackProductEvent(currentSite.id, product.id, 'view')
      trackProductEvent(currentSite.id, product.id, 'add_to_cart')
      updateCartUI()
      window.setTimeout(openCartDrawer, 120)
    }

    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0)
      const total = cart.reduce((sum, item) => sum + Number(item.price || 0) * item.quantity, 0)
      document.getElementById('cart-count').textContent = count
      document.getElementById('cart-total').textContent = money(total)
      document.getElementById('cart-fab').classList.toggle('show', count > 0)
      renderCartItems()
    }

    function renderCartItems() {
      const body = document.getElementById('cart-body')
      const theme = window.shopTheme || THEMES.general
      if (!cart.length) {
        body.innerHTML = `<div class="cart-empty"><div><strong>Votre panier est vide</strong><br>Ajoutez des produits pour préparer votre commande.</div></div>`
        return
      }
      body.innerHTML = cart.map(item => `<div class="cart-item"><div class="cart-thumb">${item.image ? `<img src="${item.image}" alt="${safe(item.name)}">` : theme.icon}</div><div><div class="cart-item-name">${safe(item.name)}</div><div class="cart-item-price">${money(item.price)} · Sous-total ${money(Number(item.price || 0) * item.quantity)}</div><div class="cart-item-bottom"><div class="qty-control"><button class="qty-btn" onclick="changeCartQty('${item.id}',-1)">−</button><span class="qty-value">${item.quantity}</span><button class="qty-btn" onclick="changeCartQty('${item.id}',1)">+</button></div><button class="cart-remove" onclick="removeFromCart('${item.id}')">Retirer</button></div></div></div>`).join('')
    }

    function changeCartQty(id, delta) {
      const item = cart.find(product => String(product.id) === String(id))
      if (!item) return
      item.quantity += delta
      if (item.quantity <= 0) cart = cart.filter(product => String(product.id) !== String(id))
      updateCartUI()
    }

    function removeFromCart(id) {
      cart = cart.filter(product => String(product.id) !== String(id))
      updateCartUI()
    }

    function clearCart() {
      cart = []
      updateCartUI()
      clearCheckoutForm()
      closeCartDrawer()
    }

    function clearCheckoutForm() {
      ['checkout-name', 'checkout-whatsapp', 'checkout-address', 'checkout-note'].forEach((id) => {
        const field = document.getElementById(id)
        if (field) field.value = ''
      })
    }

    function openCartDrawer() {
      updateCartUI()
      document.getElementById('cart-overlay').classList.add('show')
      document.getElementById('cart-drawer').classList.add('show')
    }

    function closeCartDrawer() {
      document.getElementById('cart-overlay').classList.remove('show')
      document.getElementById('cart-drawer').classList.remove('show')
    }

    function orderCart() {
      if (!cart.length) { toast('Ajoutez au moins un produit avant de commander.', 'warning', 'Panier vide'); return }
      if (OWNER_MODE) { toast('Passez par le lien client partagé pour tester une commande WhatsApp.', 'warning', 'Mode aperçu'); return }
      const customer = getCheckoutInfo()
      if (!customer) return
      const total = cart.reduce((sum, item) => sum + Number(item.price || 0) * item.quantity, 0)
      const lines = cart.map((item, index) => `${index + 1}. ${item.name} x${item.quantity} — ${money(Number(item.price || 0) * item.quantity)}`)
      trackWhatsAppClick(currentSite.id)
      openWhatsApp(buildOrderMessage(customer, lines, total))
      cart = []
      updateCartUI()
      clearCheckoutForm()
      closeCartDrawer()
      toast('Commande initiée. Votre panier a été vidé.', 'success', 'Commande envoyée')
    }

    function getGreeting() {
      const hour = new Date().getHours()
      if (hour < 12) return 'Bonjour'
      if (hour < 18) return 'Bon après-midi'
      return 'Bonsoir'
    }

    function orderReference() {
      const name = String(currentSite?.name || 'ShopLink')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 28) || 'SHOPLINK'
      const next = Number(localStorage.getItem(`shoplink_order_seq_${currentSite?.id || slugFromUrl()}`) || '0') + 1
      localStorage.setItem(`shoplink_order_seq_${currentSite?.id || slugFromUrl()}`, String(next))
      return `${name}-${String(next).padStart(4, '0')}`
    }

    function getCheckoutInfo() {
      const name = document.getElementById('checkout-name')?.value.trim() || ''
      const whatsappInput = document.getElementById('checkout-whatsapp')?.value.trim() || ''
      const whatsapp = normalizeCustomerWhatsApp(whatsappInput)
      const address = document.getElementById('checkout-address')?.value.trim() || ''
      const note = document.getElementById('checkout-note')?.value.trim() || ''

      if (!name) { toast('Renseignez votre nom avant de commander.', 'warning', 'Nom requis'); return null }
      if (!whatsapp) { toast('Format requis : +22947000674.', 'warning', 'WhatsApp invalide'); return null }
      if (!address) { toast('Renseignez votre adresse avant de commander.', 'warning', 'Adresse requise'); return null }

      return { name, whatsapp, address, note }
    }

    function normalizeCustomerWhatsApp(value) {
      const digits = String(value || '').replace(/\D/g, '')
      if (/^229\d{8}$/.test(digits)) return `+${digits}`
      if (/^\d{8}$/.test(digits)) return `+229${digits}`
      if (/^01\d{8}$/.test(digits)) return `+229${digits.slice(2)}`
      if (/^22901\d{8}$/.test(digits)) return `+229${digits.slice(5)}`
      return ''
    }

    function buildOrderMessage(customer, lines, total) {
      const noteLine = customer.note ? `\nNote : ${customer.note}` : ''
      return `${getGreeting()}, je veux passer une commande sur ${currentSite?.name || 'votre boutique'}.\n\nRéférence commande : ${orderReference()}\n\nInformations client :\nNom : ${customer.name}\nWhatsApp : ${customer.whatsapp}\nAdresse : ${customer.address}${noteLine}\n\nPanier :\n${lines.join('\n')}\n\nTotal : ${money(total)}\n\nMerci de confirmer la disponibilité et les modalités de paiement/livraison.`
    }
    function openWhatsApp(message) { const raw = String(currentSite?.whatsapp || '').replace(/\D/g, ''); const phone = raw.startsWith('229') ? raw : raw ? `229${raw}` : ''; window.open(phone ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}` : `https://wa.me/?text=${encodeURIComponent(message)}`, '_blank') }
    async function copyClientLink(slug) {
      const link = cleanUrl(slug)
      try {
        await navigator.clipboard.writeText(link)
        toast(link, 'success', 'Lien client copié')
      } catch (_e) {
        toast(link, 'warning', 'Copiez ce lien client')
      }
    }

    function visitorId() { let id = localStorage.getItem('shoplink_visitor_id'); if (!id) { id = 'visitor-' + Date.now() + '-' + Math.random().toString(36).slice(2); localStorage.setItem('shoplink_visitor_id', id) } return id }
    function sessionId() { let id = sessionStorage.getItem('shoplink_session_id'); if (!id) { id = 'session-' + Date.now() + '-' + Math.random().toString(36).slice(2); sessionStorage.setItem('shoplink_session_id', id) } return id }
    function todayKey() { return new Date().toISOString().slice(0, 10) }
    function clickedRecently(id) { const last = localStorage.getItem(`whatsapp_click_${window.currentSiteId || 'site'}_${id}`); return last && (Date.now() - Number(last)) / 36e5 < 24 }
    async function trackOfficialSiteVisit(siteId, source) { if (OWNER_MODE) return; const key = `site_visit_${siteId}_${visitorId()}_${todayKey()}`; if (localStorage.getItem(key)) return; try { await fetch(`${API_BASE}/tracking/site-visit`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, visitorId: visitorId(), source: source || 'direct' }) }); localStorage.setItem(key, '1') } catch (_) {} }
    async function trackProductEvent(siteId, productId, eventType) { if (OWNER_MODE) return; if (eventType === 'view') { const key = `product_view_${siteId}_${productId}_${visitorId()}_${todayKey()}`; if (localStorage.getItem(key)) return; try { await fetch(`${API_BASE}/tracking/product-event`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, productId, visitorId: visitorId(), eventType }) }); localStorage.setItem(key, '1') } catch (_) {} ; return } try { await fetch(`${API_BASE}/tracking/product-event`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, productId, visitorId: visitorId(), eventType }) }) } catch (_) {} }
    async function trackWeeklyLinkVisit(siteId, source) { if (OWNER_MODE) return; const key = `weekly_visit_${siteId}_${sessionId()}_${source || 'direct'}`; if (sessionStorage.getItem(key)) return; try { await fetch(`${API_BASE}/tracking/link-visit`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, source: source || 'direct' }) }); sessionStorage.setItem(key, '1') } catch (_) {} }
    async function trackVisit(siteId) { if (OWNER_MODE) return; try { await fetch(`${API_BASE}/tracking/visit`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, sessionId: sessionId(), visitorId: visitorId(), referrer: document.referrer, userAgent: navigator.userAgent, platform: visitSource() }) }) } catch (_) {} }
    async function trackWhatsAppClick(siteId, productId = null) { if (OWNER_MODE) return; if (productId && clickedRecently(productId)) return; try { await fetch(`${API_BASE}/tracking/whatsapp-click`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, productId, sessionId: sessionId(), visitorId: visitorId(), platform: visitSource() }) }); if (productId) localStorage.setItem(`whatsapp_click_${siteId}_${productId}`, Date.now()) } catch (_) {} }
    async function trackProductView(siteId, productId) { if (OWNER_MODE) return; trackProductEvent(siteId, productId, 'view'); try { await fetch(`${API_BASE}/tracking/product-view`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ siteId, productId, sessionId: sessionId(), visitorId: visitorId(), platform: visitSource() }) }) } catch (_) {} }

    window.addEventListener('beforeunload', () => { if (OWNER_MODE || !window.currentSiteId) return; const timeSpent = Date.now() - startTime; if (timeSpent > 2000) { const body = JSON.stringify({ siteId: window.currentSiteId, timeSpent, sessionId: sessionId(), visitorId: visitorId() }); navigator.sendBeacon(`${API_BASE}/tracking/time-spent`, new Blob([body], { type: 'application/json' })) } })

    loadSite()
    window.addEventListener('storage', (event) => {
      if (event.key !== siteCacheKey(slugFromUrl()) || !event.newValue) return
      try {
        const cachedData = JSON.parse(event.newValue)
        if (!cachedData.site) return
        currentSite = cachedData.site
        currentProducts = cachedData.products || []
        window.currentSiteId = currentSite.id
        applyTheme(currentSite)
        renderSite(currentSite, currentProducts)
      } catch (_error) {}
    })
    window.addEventListener('focus', () => loadSite({ silent: true }))
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadSite({ silent: true })
    })
  </script>
</body>
</html>
